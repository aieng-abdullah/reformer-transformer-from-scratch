[project]
name = "reformer-from-scratch"
version = "0.1.0"
description = "PyTorch Reformer implementation — LSH attention, reversible layers, chunked feed-forward"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "einops>=0.6.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
reformer-train = "scripts.train:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["reformer*"]

[tool.uv]
package = false
